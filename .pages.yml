media:
  input: public/images
  output: /images

content:
  - name: missioni
    label: Gatti in attesa (missioni GoFundMe)
    type: collection
    path: content/missioni
    format: json
    filename: "{year}-{month}-{day}-{primary}.json"
    view:
      fields: [name, status, raised, goal]
      primary: name
    fields:
      - name: name
        label: Nome del gatto o della missione
        type: string
        required: true
      - name: tipo
        label: Tipo di richiesta
        type: select
        default: volo
        options:
          values:
            - { name: volo, label: "Volo: gatti in attesa di partire" }
            - { name: veterinario, label: "Veterinario: gatti in cura" }
      - name: status
        label: Stato
        type: select
        default: raccolta
        options:
          values:
            - { name: raccolta, label: Raccolta fondi }
            - { name: cure, label: In cura }
            - { name: documenti, label: Documenti in corso }
            - { name: volo, label: Volo prenotato }
            - { name: casa, label: Arrivato a casa }
      - name: photo
        label: Foto (JPG, PNG o WebP)
        type: image
        options:
          rename: safe
          extensions: [jpg, jpeg, png, webp]
      - name: from
        label: Da (Emirati) – solo per richieste di volo
        type: string
      - name: to
        label: Verso (Italia) – solo per richieste di volo
        type: string
      - name: date
        label: Data del volo – solo per richieste di volo (facoltativa)
        type: date
      - name: cats
        label: Numero di gatti (aggiorna i contatori "In attesa di volo" / "In cura")
        type: number
      - name: desc
        label: Storia completa in italiano (sul sito compare un'anteprima, il testo intero si apre nella pagina della missione)
        type: text
      - name: desc_en
        label: Storia in inglese (facoltativa, per chi legge in altre lingue)
        type: text
      - name: gallery
        label: Altre foto per la pagina della storia (facoltative, fino a 8)
        type: image
        options:
          multiple:
            max: 8
          rename: safe
          extensions: [jpg, jpeg, png, webp]
      - name: link
        label: Link GoFundMe (https://gofund.me/...)
        type: string
      - name: goal
        label: Obiettivo (€)
        type: number
      - name: raised
        label: Raccolti finora (€)
        type: number
      - name: ig
        label: Link al post Instagram (facoltativo)
        type: string
      - name: order
        label: Posizione in pagina (1 = primo, facoltativo)
        type: number
      - name: visibile
        label: Mostra sul sito
        type: boolean
        default: true

  - name: viaggi
    label: Viaggi completati (gatti adottati)
    type: collection
    path: content/viaggi
    format: json
    filename: "{year}-{month}-{day}-{primary}.json"
    view:
      fields: [cats, date, to]
      primary: cats
    fields:
      - name: title
        label: Titolo del viaggio (facoltativo, es. "15 gatti a casa!")
        type: string
      - name: cats
        label: Gatti adottati (nomi separati da virgola)
        type: string
        required: true
      - name: count
        label: Numero di gatti (facoltativo, se vuoto conta i nomi)
        type: number
      - name: date
        label: Data del volo
        type: date
        required: true
      - name: from
        label: Da
        type: string
      - name: to
        label: A
        type: string
      - name: note
        label: Racconto completo in italiano (sul sito compare un'anteprima, il testo intero nella pagina del viaggio)
        type: text
      - name: note_en
        label: Racconto breve in inglese (facoltativo)
        type: text
      - name: photos
        label: Foto (la prima è la copertina, fino a 12)
        type: image
        options:
          multiple:
            max: 12
          rename: safe
          extensions: [jpg, jpeg, png, webp]
      - name: visibile
        label: Mostra sul sito
        type: boolean
        default: true

  - name: costi
    label: Prezzi delle spese (in AED)
    type: file
    path: content/costi.json
    format: json
    fields:
      - { name: fivfelv, label: Test FIV/FeLV (AED), type: number }
      - { name: fcov, label: Test coronavirus felino (AED), type: number }
      - { name: giardia, label: Test Giardia (AED), type: number }
      - { name: blood, label: Analisi del sangue (AED), type: number }
      - { name: parvo, label: Vaccino trivalente (AED), type: number }
      - { name: deworm, label: Sverminazione e antiparassitari (AED), type: number }
      - { name: steril, label: Sterilizzazione (AED), type: number }
      - { name: extra, label: Cure aggiuntive, a partire da (AED), type: number }
      - { name: microchip, label: Microchip (AED), type: number }
      - { name: rabies, label: Vaccino antirabbia (AED), type: number }
      - { name: cert, label: Certificato sanitario UE (AED), type: number }
      - { name: export, label: Pratiche per l'esportazione (AED), type: number }
      - { name: flight, label: Volo in stiva (AED), type: number }
      - { name: crate, label: Gabbia omologata IATA (AED), type: number }
      - { name: foster, label: Stallo o pensione dal veterinario (AED a settimana), type: number }
      - { name: food, label: Cibo (AED a settimana), type: number }

  - name: sito
    label: Impostazioni del sito
    type: file
    path: content/sito.json
    format: json
    fields:
      - name: instagram
        label: Nome account Instagram (senza @)
        type: string
      - name: cambio_automatico
        label: Aggiorna il cambio AED → EUR in automatico
        type: boolean
        default: true
      - name: cambio_aed_eur
        label: Cambio manuale, quanti euro vale 1 AED (usato se il cambio automatico è spento o non disponibile)
        type: number
